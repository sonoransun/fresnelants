[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fresnelants"
version = "0.1.0"
description = "Fresnel antenna design system: zone plates, offset, phase-correcting, reflectarrays, and 3D curvilinear/constructed designs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "FresnelAnts contributors" },
]
keywords = ["antenna", "fresnel", "zone plate", "reflectarray", "physical optics", "electromagnetics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "trimesh>=4.4",
    "numpy-stl>=3.1",
    "networkx>=3.0",
]

[project.optional-dependencies]
viz3d = [
    "pyvista>=0.43",
    "plotly>=5.20",
]
cad = [
    "cadquery>=2.4",
    "gerber-writer>=0.4",
]
fullwave = [
    "PyNEC2>=1.7",
]
fast = [
    "numba>=0.59",
]
synth = [
    "cvxpy>=1.5",
    "jax>=0.4",
    "jaxlib>=0.4",
]
measurement = [
    "scikit-rf>=1.3",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-mermaid2-plugin>=1.1",
    "mkdocstrings[python]>=0.25",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
fresnelants = "fresnelants.cli:app"

[project.urls]
Documentation = "https://github.com/example/fresnelants"
Source = "https://github.com/example/fresnelants"

[tool.hatch.build.targets.wheel]
packages = ["src/fresnelants"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "N",             # pep8-naming
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = [
    "E501",   # handled by formatter
    "N803",   # allow physics-style upper-case args (F, D, ...)
    "N806",   # local upper-case names (E, H, ...)
    "N802",   # function names with capitals (E_field, etc.)
    "RUF001", # Greek / math glyphs in strings (intentional in a physics lib)
    "RUF002",
    "RUF003",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "trimesh.*",
    "stl.*",
    "scipy.*",
    "matplotlib.*",
    "mpl_toolkits.*",
    "pyvista.*",
    "plotly.*",
    "cadquery.*",
    "gerber_writer.*",
    "PyNEC.*",
    "yaml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "fullwave: tests that require the [fullwave] extra (PyNEC2 / Meep)",
    "slow: long-running tests",
]
